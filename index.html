<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الاختبار الميداني: تنظيف الزيتون والطحن المتقدم - المحور الأول</title>
    <style>
        :root {
            --primary-color: #2c5e3b;
            --secondary-color: #558b2f;
            --accent-color: #f4f6f0;
            --text-color: #333333;
            --card-bg: #ffffff;
            --border-radius: 12px;
        }

        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--accent-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 750px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--secondary-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            line-height: 1.4;
        }

        header p {
            color: #666;
            font-size: 0.95rem;
            margin: 0;
        }

        .question-card {
            margin-bottom: 20px;
            display: none;
        }

        .question-card.active {
            display: block;
        }

        .question-title {
            font-size: 1.05rem;
            font-weight: bold;
            color: var(--primary-color);
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .option-item {
            background: #f9fbf8;
            border: 2px solid #e2e8f0;
            padding: 12px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
        }

        .option-item:hover {
            border-color: var(--secondary-color);
            background: #f1f8e9;
        }

        .option-item.selected {
            border-color: var(--primary-color);
            background: #e8f5e9;
            font-weight: bold;
        }

        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        button.action-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button.action-btn:hover {
            background-color: #1e3f27;
        }

        .result-container {
            text-align: center;
            display: none;
        }

        .result-container h2 {
            color: var(--primary-color);
            font-size: 1.8rem;
        }

        .score-box {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--secondary-color);
            margin: 20px 0;
        }

        .feedback-msg {
            font-size: 1.1rem;
            margin-bottom: 25px;
            color: #444;
        }

        .review-box {
            text-align: right;
            margin-top: 20px;
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }

        .review-item {
            margin-bottom: 15px;
            padding: 12px;
            border-radius: 6px;
            border-right: 5px solid #ccc;
            background: #fff;
        }

        .review-item.correct-ans {
            border-right-color: #558b2f;
            background: #f1f8e9;
        }

        .review-item.wrong-ans {
            border-right-color: #c62828;
            background: #ffebee;
        }

        .result-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img src="Logo100.jpg" alt="شعار مجموعة التكوين والتأطير" onerror="this.src='logo100.jpg'">
        </div>
        <h1>🫒 المحور الأول: التنظيف المتقدم والطحن الاحترافي</h1>
        <p>مجموعة التكوين والتأطير — الحلقتان 3 و 4</p>
    </header>

    <div id="quiz-form"></div>

    <div class="btn-container" id="nav-buttons">
        <button class="action-btn" id="prev-btn" onclick="prevQuestion()" style="display: none;">السابق</button>
        <div style="flex-grow: 1;"></div>
        <button class="action-btn" id="next-btn" onclick="nextQuestion()">التالي</button>
    </div>

    <div class="result-container" id="result-screen">
        <h2>نتيجة التقييم الميداني 🏆</h2>
        <div class="score-box" id="score-display">0 / 6</div>
        <div class="feedback-msg" id="feedback-text"></div>
        <div class="result-buttons">
            <button class="action-btn" onclick="restartQuiz()">إعادة الاختبار 🔄</button>
            <button class="action-btn" style="background-color: #558b2f;" onclick="showReview()">مراجعة الإجابات الصحيحة 📖</button>
        </div>
        <div id="review-section" style="display: none;" class="review-box"></div>
    </div>
</div>

<script>
    const questions = [
        {
            title: "1. أثناء استقبال شحنة زيتون تبدو نظيفة نسبياً ولا تحمل أتربة واضحة، ما هو التصرف التقني السليم بخصوص عملية الغسل؟",
            options: [
                "يجب غسلها دائماً وبشكل إجباري وأوتوماتيكي لضمان إزالة الأتربة الدقيقة.",
                "يُفضل تخطي مرحلة الغسل بالماء لتجنب رفع نسبة الرطوبة في الثمار وخلق بيئة مائية غير ضرورية مادامت الثمار نظيفة.",
                "غسلها بماء دافئ لزيادة ليونة الثمار قبل الطحن مباشرة."
            ],
            correct: 1
        },
        {
            title: "2. ما هو التأثير السلبي المباشر لترك الأوراق والأغصان بكميات كبيرة تختلط بالزيتون أثناء عملية الطحن؟",
            options: [
                "تساهم في زيادة كمية الزيت المستخرجة بنسبة كبيرة.",
                "تمنح الزيت نكهة عشبية مستحبة جداً ومطلوبة عالمياً في كل الظروف.",
                "تضفي طعماً مراً لاذعاً وغير مرغوب (عصارة الأوراق والكلوروفيل الزائد) وتؤثر سلباً على التوازن الحسي للزيت."
            ],
            correct: 2
        },
        {
            title: "3. إذا لاحظت أثناء عملية الطحن ارتفاعاً ملحوظاً وحارّاً في درجة حرارة عجينة الزيتون داخل المطحنة، ما هو الانعكاس على جودة الزيت؟",
            options: [
                "يحسن من سيولة الزيت ويسرع عملية الاستخلاص دون أي أثر سلبي.",
                "يؤدي إلى تطاير المركبات العطرية الطيارة وتخريب مضادات الأكسدة الطبيعية، مما يقلل من جودة الزيت.",
                "يقضي على الأحماض الدهنية الحرة نهائياً ويطيل عمر الزيت الافتراضي."
            ],
            correct: 1
        },
        {
            title: "4. يعتقد بعض العمال خطأً أن 'الطحن الأكثر عدوانية وسرعة' يرفع الإنتاجية. ما هي النتيجة التقنية الحقيقية لهذه الممارسة؟",
            options: [
                "الحصول على عجينة متجانسة جداً ومثالية بكل المقاييس.",
                "ارتفاع حرارة العجينة وتكسير مفرط يجهد مرحلة العجن اللاحقة ويهدد بكسر مستحلبات الزيت.",
                "زيادة سرعة تدفق خط الإنتاج وتوفير استهلاك الطاقة الكهربائية."
            ],
            correct: 1
        },
        {
            title: "5. لماذا تُعتبر صيانة ونظافة 'المطحنة' ومسارها الداخلي من أولويات المعصرة؟",
            options: [
                "لأن الأجزاء الداخلية لا تلامس المادة الخام بشكل مباشر، وبالتالي فنظافتها الثانوية كافية.",
                "لأن بقايا العجينة والزيت القديمة الملتصقة تصبح عرضة للتأكسد وتعمل كبؤرة تلوث تنقل النكهات الفاسدة للدفعات الجديدة.",
                "لتجنب صدأ الهيكل الخارجي للآلة أمام لجان المراقبة."
            ],
            correct: 1
        },
        {
            title: "6. ما هي القاعدة الذهبية الحقيقية التي تضمن نجاح مرحلة الطحن والاستخراج الأولية؟",
            options: [
                "الاعتماد على قوة المحرك وسرعة الطحن المطلقة.",
                "طحن مناسب متناغم مع خصائص الثمار + معدات نظيفة تماماً + تحكم دقيق في الحرارة.",
                "إضافة كميات من الماء الساخن أثناء الطحن لتسهيل التفتيت."
            ],
            correct: 1
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(questions.length).fill(null);

    const quizForm = document.getElementById('quiz-form');
    const navButtons = document.getElementById('nav-buttons');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const resultScreen = document.getElementById('result-screen');
    const scoreDisplay = document.getElementById('score-display');
    const feedbackText = document.getElementById('feedback-text');
    const reviewSection = document.getElementById('review-section');

    function renderQuestion() {
        quizForm.innerHTML = '';
        const q = questions[currentQuestion];
        let html = `<div class="question-card active">
            <div class="question-title">${q.title}</div>
            <div class="options-list">`;
        
        q.options.forEach((opt, idx) => {
            const isSelected = userAnswers[currentQuestion] === idx ? 'selected' : '';
            html += `<div class="option-item ${isSelected}" onclick="selectOption(${idx})">${opt}</div>`;
        });

        html += `</div></div>`;
        quizForm.innerHTML = html;

        prevBtn.style.display = currentQuestion === 0 ? 'none' : 'block';
        nextBtn.innerText = currentQuestion === questions.length - 1 ? 'إرسال وعرض النتيجة' : 'التالي';
    }

    function selectOption(optionIndex) {
        userAnswers[currentQuestion] = optionIndex;
        renderQuestion();
    }

    function nextQuestion() {
        if (userAnswers[currentQuestion] === null) {
            alert('الرجاء اختيار إجابة قبل الانتقال للسؤال التالي.');
            return;
        }

        if (currentQuestion < questions.length - 1) {
            currentQuestion++;
            renderQuestion();
        } else {
            showResults();
        }
    }

    function prevQuestion() {
        if (currentQuestion > 0) {
            currentQuestion--;
            renderQuestion();
        }
    }

    function showResults() {
        quizForm.style.display = 'none';
        navButtons.style.display = 'none';
        resultScreen.style.display = 'block';
        reviewSection.style.display = 'none';

        let score = 0;
        userAnswers.forEach((ans, idx) => {
            if (ans === questions[idx].correct) score++;
        });

        scoreDisplay.innerText = `${score} / ${questions.length}`;

        if (score === 6) {
            feedbackText.innerText = "🌟 أداء استثنائي! إجاباتك تعكس فهماً عميقاً وتحليلياً للممارسات الميدانية عالية الجودة.";
        } else if (score >= 4) {
            feedbackText.innerText = "👏 مستوى متميز، لديك إلمام قوي بالدقائق التقنية والاحترازية في المعصرة.";
        } else {
            feedbackText.innerText = "💡  الأسئلة تضمنت تفاصيل دقيقة؛ نوصي بإعادة مراجعة الحلقات لترسيخ المفاهيم أكثر.";
        }
    }

    function showReview() {
        let reviewHtml = "<h3 style='color: var(--primary-color); text-align:center;'>مراجعة الإجابات الصحيحة والتصحيح:</h3>";
        questions.forEach((q, idx) => {
            const userAns = userAnswers[idx];
            const correctAns = q.correct;
            const isCorrect = userAns === correctAns;
            
            reviewHtml += `<div class="review-item ${isCorrect ? 'correct-ans' : 'wrong-ans'}">
                <strong>السؤال ${idx + 1}: ${q.title}</strong><br>
                <span style="color: ${isCorrect ? '#2e7d32' : '#c62828'};">
                    إجابتك: ${userAns !== null ? q.options[userAns] : 'لم تجب'} ${isCorrect ? '✓' : '✗'}
                </span><br>`;
            
            if (!isCorrect) {
                reviewHtml += `<span style="color: #2e7d32; font-weight: bold;">الإجابة الصحيحة: ${q.options[correctAns]}</span>`;
            }
            reviewHtml += `</div>`;
        });
        reviewSection.innerHTML = reviewHtml;
        reviewSection.style.display = 'block';
    }

    function restartQuiz() {
        currentQuestion = 0;
        userAnswers.fill(null);
        resultScreen.style.display = 'none';
        quizForm.style.display = 'block';
        navButtons.style.display = 'flex';
        renderQuestion();
    }

    renderQuestion();
</script>

</body>
</html>
